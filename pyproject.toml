[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whyfi"
version = "0.1.0"
description = "An intelligent network diagnostic agent that finds out why your internet isn't working."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0,<8.0",
    "dnspython>=2.7,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pyinstaller>=6.0,<7.0"
]

[tool.setuptools]
package-dir = {"" = "engine"}

[tool.setuptools.packages.find]
where = ["engine"]
include = ["whyfi*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]

[project.scripts]
whyfi = "whyfi.__main__:main"
